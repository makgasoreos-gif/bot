<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Bot Console{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c10;
  --bg-panel: #12151b;
  --bg-elevated: #191d25;
  --bg-input: #0e1116;
  --accent: #4ce0b3;
  --accent-dim: #2a9e7c;
  --warn: #f2b84c;
  --danger: #ff5c72;
  --text: #eceff4;
  --text-muted: #7c8699;
  --border: #1f2530;
  --border-strong: #2a3140;
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; }
body { margin:0; font-family: var(--font-body); background: var(--bg); color: var(--text); font-size:15px; }
a { color: inherit; }
.app { display:flex; min-height:100vh; }

.sidebar { width: 236px; flex-shrink:0; background: var(--bg-panel); border-right: 1px solid var(--border);
  padding: 22px 16px; display:flex; flex-direction:column; gap:26px; }
.brand { display:flex; align-items:center; gap:10px; font-family: var(--font-display); font-weight:700;
  font-size:16px; text-decoration:none; color:var(--text); padding: 0 6px; }
.brand .dot { width:8px; height:8px; border-radius:50%; background: var(--accent);
  box-shadow: 0 0 0 3px rgba(76,224,179,0.15); flex-shrink:0; }
.nav-group { display:flex; flex-direction:column; gap:2px; }
.nav-label { font-family: var(--font-mono); font-size:11px; color: var(--text-muted); padding: 8px 10px 6px; }
.nav-link { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
  color:var(--text-muted); text-decoration:none; font-size:14px; font-weight:500; }
.nav-link:hover { background: var(--bg-elevated); color: var(--text); }
.nav-link.active { background: var(--bg-elevated); color: var(--accent); }
.nav-link .ico { width:16px; text-align:center; opacity:.9; font-family: var(--font-mono); }
.sidebar-footer { margin-top:auto; padding: 12px 10px 0; border-top:1px solid var(--border);
  font-family: var(--font-mono); font-size:12px; color: var(--text-muted); }

.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 32px;
  border-bottom:1px solid var(--border); }
.topbar .crumb { font-family: var(--font-mono); font-size:13px; color: var(--text-muted); }
.content { padding: 32px; max-width: 920px; width:100%; margin:0 auto; }

h1 { font-family: var(--font-display); font-size:28px; font-weight:700; margin:0 0 6px; letter-spacing:-0.01em; }
h2 { font-family: var(--font-display); font-size:17px; font-weight:600; margin:0 0 16px; }
p.muted { color: var(--text-muted); margin-top:0; line-height:1.5; }

.panel { background: var(--bg-panel); border:1px solid var(--border); border-radius:14px; padding:24px; margin-bottom:18px; }

.btn { display:inline-flex; align-items:center; gap:6px; background: var(--accent); color: #04140f;
  padding:10px 18px; border:none; border-radius:8px; font-weight:600; font-size:14px; text-decoration:none;
  cursor:pointer; font-family: var(--font-body); }
.btn:hover { background:#6ee9c6; }
.btn-secondary { background: transparent; border:1px solid var(--border-strong); color: var(--text); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-warn { background: var(--warn); color:#3a2600; }
.btn-warn:hover { background:#f7c96a; }
.btn-danger { background: var(--danger); color:#3a0209; }
.btn-danger:hover { background:#ff7c8f; }

label { display:block; font-family: var(--font-mono); font-size:11.5px; font-weight:500; color: var(--text-muted); margin:16px 0 6px; }
input[type=text], input[type=number], select, textarea {
  width:100%; padding:10px 12px; background: var(--bg-input); border:1px solid var(--border-strong);
  border-radius:8px; color: var(--text); font-size:14px; font-family: var(--font-body); }
textarea { resize:vertical; min-height:64px; }
input:focus, select:focus, textarea:focus { outline:none; border-color: var(--accent); }

.row { display:flex; gap:16px; flex-wrap:wrap; }
.row > div { flex:1; min-width:200px; }
.divider { border-top:1px solid var(--border); margin: 18px 0; padding-top:18px; }

.flash { font-family: var(--font-mono); font-size:13px; background: rgba(76,224,179,.08);
  border:1px solid var(--accent-dim); color: var(--accent); padding:10px 14px; border-radius:8px; margin-bottom:18px; }
.flash-danger { background: rgba(255,92,114,.08); border-color: var(--danger); color: #ff9aa8; }

table { width:100%; border-collapse:collapse; margin-top:6px; }
th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); font-size:13.5px; }
th { color: var(--text-muted); font-weight:500; font-family: var(--font-mono); font-size:11.5px; }
.mono { font-family: var(--font-mono); color: var(--text-muted); font-size:13px; }

.list-row { display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
  background: var(--bg-elevated); border:1px solid var(--border); border-radius:10px; margin-bottom:8px; }
.actions button { background:none; border:none; color: var(--danger); cursor:pointer; font-size:13px;
  font-family: var(--font-mono); padding:0; }
.actions button:hover { text-decoration:underline; }

@media (max-width: 780px) {
  .app { flex-direction:column; }
  .sidebar { width:100%; flex-direction:row; overflow-x:auto; padding:12px 16px; align-items:center; }
  .nav-group { flex-direction:row; }
  .sidebar-footer { display:none; }
  .content { padding: 20px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a href="/" class="brand"><span class="dot"></span>bot console</a>
    {% block sidebar %}
    <div class="nav-group">
      <a class="nav-link active" href="/dashboard"><span class="ico">⌂</span>Servers</a>
    </div>
    {% endblock %}
    <div class="sidebar-footer">
      {% if user %}Συνδεδεμένος ως<br><span style="color:var(--text)">{{ user.username }}</span>
      {% else %}Μη συνδεδεμένος{% endif %}
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="crumb">{% block breadcrumb %}{% endblock %}</div>
      <div>
        {% if user %}<a href="/logout" style="text-decoration:none; color:var(--text-muted); font-size:13px;">Αποσύνδεση →</a>
        {% else %}<a href="/login" style="text-decoration:none; color:var(--accent); font-size:13px; font-weight:600;">Login with Discord →</a>{% endif %}
      </div>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
</body>
</html>
